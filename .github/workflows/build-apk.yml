yaml
name: Build NIXI APK (debug)

on:
  workflow_dispatch:        # ręczny przycisk "Run workflow" w zakładce Actions
  push:
    branches: [main]        # usuń ten blok, jeśli chcesz budować wyłącznie ręcznie

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest   # runner GitHub ma już Android SDK + JDK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Ten projekt wymaga Gradle >= 9.1 (AGP 9.x) - pobieramy dokładną wersję z wrapper properties
      - name: Set up Gradle 9.3.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      # app/build.gradle.kts wskazuje signingConfig debug na ten plik - bez niego build padnie
      - name: Create debug.keystore (signingConfig "debugConfig")
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      # Secretplugin czyta .env z głównego katalogu -> BuildConfig.GEMINI_API_KEY itd.
      - name: Create .env from secrets
        run: |
          {
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          } > .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Show toolchain
        run: java -version && gradle --version

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIXI-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
